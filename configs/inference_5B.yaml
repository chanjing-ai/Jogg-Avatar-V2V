# Paths are relative to the repository root by default.
model_dir: ${JOGG_AVATAR_MODEL_DIR:-models}
base_model_dir: ${model_dir}/Wan2.2-TI2V-5B
avatar_model_dir: ${model_dir}/Jogg-Avatar-Wan2.2-5B

dtype: bf16
text_encoder_path: ${base_model_dir}/models_t5_umt5-xxl-enc-bf16.pth
dit_path: >-
  ${base_model_dir}/diffusion_pytorch_model-00001-of-00003.safetensors,
  ${base_model_dir}/diffusion_pytorch_model-00002-of-00003.safetensors,
  ${base_model_dir}/diffusion_pytorch_model-00003-of-00003.safetensors
vae_path: ${base_model_dir}/Wan2.2_VAE.pth
wav2vec_path: ${model_dir}/wav2vec2-base-960h
exp_path: ${avatar_model_dir}
lora_ckpt_path: ${avatar_model_dir}/diffusion_pytorch_model.safetensors

reload_cfg: false
train_architecture: lora
i2v: true
use_audio: true
random_prefix_frames: true
lora_target_modules: q,k,v,o,ffn.0,ffn.2
init_lora_weights: kaiming
lora_rank: 128
lora_alpha: 64.0

sp_size: 1
use_fsdp: false
num_persistent_param_in_dit:

seed: 42
max_hw: 1280
max_tokens: 30000
seq_len: 200
overlap_frame: 13
guidance_scale: 5.0
audio_scale:
num_steps: 8
fps: 24
sample_rate: 16000
negative_prompt: "Vivid color tones, background/camera moving quickly, screen switching, subtitles and special effects, mutation, overexposed, static, blurred details, subtitles, style, work, painting, image, still, overall grayish, worst quality, low quality, JPEG compression residue, ugly, incomplete, extra fingers, poorly drawn hands, poorly drawn face, deformed, disfigured, malformed limbs, fingers merging, motionless image, chaotic background, three legs, crowded background with many people, walking backward"
silence_duration_s: 0.3

tea_cache_l1_thresh: 0.12
feature_caching: Custom
use_sage_attention: false
